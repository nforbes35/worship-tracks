[project]
name = "worship-tracks"
version = "0.1.0"
description = "Recreates each instrument of a song as its own play-along track, on your own Mac."
requires-python = "==3.11.*"
dependencies = [
    "basic-pitch==0.4.0",
    "demucs==4.1.0",
    "fastapi>=0.115",
    "librosa>=0.10",
    "numpy>=1.26",
    "pretty-midi>=0.2.10",
    "python-multipart>=0.0.9",
    "soundfile>=0.12",
    # Basic Pitch needs resampy<0.4.3, which imports pkg_resources (removed in setuptools 81).
    "setuptools<81",
    "torch>=2.4",
    "uvicorn>=0.30",
    # Basic Pitch runs on Core ML on the Mac; on Linux (CI/testing) use ONNX instead.
    "onnxruntime>=1.18; sys_platform == 'linux'",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
# This is an app, not a library: nothing to build or publish.
package = false
# Basic Pitch would pull in TensorFlow on Linux; ONNX Runtime does the same job.
override-dependencies = ["tensorflow; sys_platform == 'never'"]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'", "sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["server"]

[tool.ruff]
line-length = 120
